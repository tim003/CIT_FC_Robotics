  <text x="250" y="800" font-size="13" fill="#7a2b12">8 &#215; 3-pin servo leads (V+, GND, PWM) from ch0&#8211;ch7</text>
  <path class="wire gnd" d="M816,441 L836,441 L836,544 L1500,544"/>
  <path class="wire gnd" d="M1370,480 L1370,544"/>
  <path class="wire gnd" d="M1450,560 L1450,544"/>
  <path class="wire v33" d="M1425,480 L1425,500 L1752,500 L1752,896 L392,896 L392,715 L482,715"/>
  <path class="wire scl" d="M1480,480 L1480,514 L1740,514 L1740,910 L613,910 L613,746"/>
  <path class="wire sda" d="M1535,480 L1535,528 L1728,528 L1728,924 L535,924 L535,746"/>
  <path class="wire spi" d="M1286,641 L1292,641 L1292,622 L1346,622"/>
  <path class="wire spi" d="M1286,669 L1298,669 L1298,646 L1346,646"/>
  <path class="wire spi" d="M1286,697 L1304,697 L1304,670 L1346,670"/>
  <path class="wire spi" d="M1286,725 L1310,725 L1310,694 L1346,694"/>
  <path class="wire spi" d="M1286,753 L1316,753 L1316,718 L1346,718"/>
  <path class="wire spi" d="M1286,781 L1322,781 L1322,742 L1346,742"/>
  <path class="wire spi" d="M1286,809 L1328,809 L1328,766 L1346,766"/>
  <path class="wire spi" d="M1286,837 L1334,837 L1334,790 L1346,790"/>
  <path class="wire v33" d="M1400,860 L1400,896"/>

  <g>
    <text x="470" y="966" class="warn">Critical: PCA9685 VCC (3V3) is logic only &#8212; it is NOT V+ (5V).</text>
    <text x="470" y="988" class="warn">Critical: the S3 5V branch is taken from the rail node, NOT chained off the PCA9685 V+ terminal.</text>
    <text x="470" y="1010" class="warn">Critical: servo current never flows through the ESP32.</text>
    <text x="470" y="1032" class="warn">OE left unconnected: PCA9685 outputs go live the instant the rail comes up &#8212; servos cannot be held off during boot.</text>
    <text x="470" y="1054" class="note">Set the LM2596S to 5.0 V with no load. No bulk cap at V+ in this scheme &#8212; expect more rail sag under simultaneous servo load.</text>
  </g>

</svg>
