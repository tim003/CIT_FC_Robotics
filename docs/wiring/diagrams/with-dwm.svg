<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 1080" font-family="Verdana, Segoe UI, sans-serif">
  <defs>
    <style>
      .wire{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .w5v{stroke:#e23b2e}.gnd{stroke:#141414}.sig{stroke:#f6a623}
      .sda{stroke:#33aa44}.scl{stroke:#2aa4dd}.oe{stroke:#8e44ad}
      .v33{stroke:#f4b400}.spi{stroke:#7a5cff}
      .board{stroke:#333;stroke-width:2}
      .lbl{font-size:18px;fill:#111}.lbls{font-size:14px;fill:#222}
      .pin{font-size:13px;fill:#fff;font-weight:bold}
      .note{font-size:14px;fill:#7a2b12}
      .warn{font-size:14px;fill:#b00020;font-weight:bold}
      .h1{font-size:34px;font-weight:bold;fill:#1c1c1c}
      .h2{font-size:22px;font-weight:bold;fill:#7b2d8e}
      .cap{font-size:15px;fill:#333;font-weight:bold}
    </style>
  </defs>

  <rect x="0" y="0" width="1720" height="1080" fill="#ffffff"/>

  <!-- ===== Title ===== -->
  <g transform="translate(40,34)">
    <g fill="#e8632a">
      <rect x="4" y="10" width="14" height="14" rx="3"/><rect x="24" y="4" width="14" height="14" rx="3"/>
      <rect x="44" y="10" width="14" height="14" rx="3"/><rect x="14" y="28" width="34" height="16" rx="4"/>
      <rect x="6" y="46" width="8" height="16"/><rect x="22" y="46" width="8" height="16"/>
      <rect x="34" y="46" width="8" height="16"/><rect x="50" y="46" width="8" height="16"/>
    </g>
    <text x="78" y="30" class="h1">Sesame Robot Project</text>
    <text x="78" y="58" class="h2">S3 Mini &#183; PCA9685 Wiring Guide &#8212; WITH UWB (DWM) module</text>
  </g>

  <!-- ===== Legend ===== -->
  <g transform="translate(1300,26)">
    <rect x="0" y="0" width="380" height="120" rx="10" fill="#fafafa" class="board"/>
    <text x="14" y="24" class="lbl" font-weight="bold">Wire colour key</text>
    <g stroke-width="6" stroke-linecap="round">
      <line x1="16" y1="44" x2="52" y2="44" stroke="#e23b2e"/><text x="60" y="49" class="lbls">5V / V+ rail</text>
      <line x1="16" y1="66" x2="52" y2="66" stroke="#141414"/><text x="60" y="71" class="lbls">GND (star)</text>
      <line x1="16" y1="88" x2="52" y2="88" stroke="#f6a623"/><text x="60" y="93" class="lbls">Servo PWM signal</text>
      <line x1="200" y1="44" x2="236" y2="44" stroke="#33aa44"/><text x="244" y="49" class="lbls">I2C SDA (2)</text>
      <line x1="200" y1="66" x2="236" y2="66" stroke="#2aa4dd"/><text x="244" y="71" class="lbls">I2C SCL (3)</text>
      <line x1="200" y1="88" x2="236" y2="88" stroke="#8e44ad"/><text x="244" y="93" class="lbls">PCA9685 OE (18)</text>
      <line x1="200" y1="108" x2="236" y2="108" stroke="#7a5cff"/><text x="244" y="113" class="lbls">UWB SPI bus</text>
      <line x1="16" y1="108" x2="52" y2="108" stroke="#f4b400"/><text x="60" y="113" class="lbls">3V3 logic</text>
    </g>
  </g>

  <!-- ===== Battery ===== -->
  <g transform="translate(40,150)">
    <rect x="0" y="0" width="250" height="120" rx="8" fill="#fff" class="board"/>
    <text x="125" y="52" text-anchor="middle" font-size="30" fill="#111">BATTERY</text>
    <text x="125" y="88" text-anchor="middle" font-size="24" fill="#b00020">5V &#8211; 12V</text>
    <text x="256" y="34" class="lbls">+Ve</text>
    <text x="256" y="104" class="lbls">&#8722;Ve</text>
  </g>

  <!-- Rocker switch -->
  <g transform="translate(360,120)">
    <rect x="0" y="0" width="70" height="46" rx="8" fill="#222"/>
    <rect x="8" y="8" width="54" height="30" rx="4" fill="#444"/>
    <text x="35" y="-8" text-anchor="middle" class="lbls">power switch</text>
  </g>

  <!-- USB-C alt source -->
  <g transform="translate(40,300)">
    <rect x="0" y="0" width="250" height="70" rx="8" fill="#fff" class="board"/>
    <text x="125" y="30" text-anchor="middle" font-size="18" fill="#111">USB-C 5V</text>
    <text x="125" y="54" text-anchor="middle" font-size="13" fill="#555">alternate source</text>
  </g>

  <!-- SPDT source selector -->
  <g transform="translate(360,300)">
    <rect x="0" y="0" width="90" height="70" rx="8" fill="#eef" class="board"/>
    <text x="45" y="28" text-anchor="middle" font-size="14" fill="#111">SPDT</text>
    <text x="45" y="46" text-anchor="middle" font-size="11" fill="#555">source</text>
    <text x="45" y="60" text-anchor="middle" font-size="11" fill="#555">select</text>
  </g>

  <!-- ===== LM2596S buck ===== -->
  <g transform="translate(470,150)">
    <rect x="0" y="0" width="220" height="120" rx="8" fill="#1746a2" class="board"/>
    <rect x="18" y="20" width="60" height="80" rx="4" fill="#0f2f6e"/>
    <circle cx="150" cy="60" r="26" fill="#c9c9c9"/>
    <rect x="120" y="30" width="18" height="18" fill="#e6b800"/>
    <text x="10" y="-10" font-size="15" fill="#111">&#9660; Set to 5.2V output (no load)</text>
    <text x="-16" y="28" text-anchor="end" class="lbls" fill="#111">IN+</text>
    <text x="-16" y="104" text-anchor="end" class="lbls" fill="#111">IN&#8722;</text>
    <text x="236" y="28" class="lbls" fill="#111">OUT+</text>
    <text x="236" y="104" class="lbls" fill="#111">OUT&#8722;</text>
  </g>

  <!-- ===== Power distribution bus ===== -->
  <g transform="translate(470,410)">
    <rect x="0" y="0" width="360" height="110" rx="8" fill="#3fae4a" class="board"/>
    <text x="180" y="-12" text-anchor="middle" class="lbl" font-weight="bold">Power distribution &#38; ground star</text>
    <!-- GND row -->
    <rect x="14" y="14" width="332" height="34" rx="6" fill="#141414"/>
    <text x="180" y="37" text-anchor="middle" class="pin">GND_STAR</text>
    <!-- 5V row -->
    <rect x="14" y="60" width="332" height="34" rx="6" fill="#e23b2e"/>
    <text x="180" y="83" text-anchor="middle" class="pin">5V_RAIL (5.2V)</text>
  </g>

  <!-- 1000uF bulk cap -->
  <g transform="translate(870,470)">
    <rect x="0" y="0" width="22" height="56" rx="4" fill="#111"/>
    <rect x="4" y="0" width="14" height="56" fill="#3a3a3a"/>
    <text x="11" y="-8" text-anchor="middle" class="cap">1000&#181;F</text>
    <text x="11" y="74" text-anchor="middle" font-size="11" fill="#555">at V+</text>
  </g>

  <!-- ===== PCA9685 ===== -->
  <g transform="translate(470,600)">
    <rect x="0" y="0" width="360" height="180" rx="8" fill="#0c7c59" class="board"/>
    <text x="180" y="30" text-anchor="middle" font-size="20" fill="#fff" font-weight="bold">PCA9685  (I2C 0x40)</text>
    <!-- control pins left -->
    <g font-size="12" fill="#fff">
      <rect x="12" y="46" width="70" height="22" rx="4" fill="#e23b2e"/><text x="47" y="61" text-anchor="middle" class="pin">V+ (5V)</text>
      <rect x="12" y="72" width="70" height="22" rx="4" fill="#141414"/><text x="47" y="87" text-anchor="middle" class="pin">GND</text>
      <rect x="12" y="98" width="70" height="22" rx="4" fill="#f4b400"/><text x="47" y="113" text-anchor="middle" class="pin" fill="#111">VCC 3V3</text>
      <rect x="12" y="124" width="70" height="22" rx="4" fill="#33aa44"/><text x="47" y="139" text-anchor="middle" class="pin">SDA</text>
      <rect x="90" y="124" width="70" height="22" rx="4" fill="#2aa4dd"/><text x="125" y="139" text-anchor="middle" class="pin">SCL</text>
      <rect x="168" y="124" width="70" height="22" rx="4" fill="#8e44ad"/><text x="203" y="139" text-anchor="middle" class="pin">OE</text>
    </g>
    <!-- channel pads bottom -->
    <g>
      <text x="180" y="166" text-anchor="middle" font-size="12" fill="#eaffea">ch0&#8230;ch7 &#8594; legs  |  ch8 reserved  |  ch9&#8211;15 spare</text>
    </g>
    <!-- ch0-7 signal tap points on top edge -->
    <g fill="#f6a623">
      <circle cx="250" cy="8" r="5"/><circle cx="268" cy="8" r="5"/><circle cx="286" cy="8" r="5"/><circle cx="304" cy="8" r="5"/>
      <circle cx="322" cy="8" r="5"/><circle cx="340" cy="8" r="5"/><circle cx="352" cy="46" r="5"/><circle cx="352" cy="64" r="5"/>
    </g>
  </g>

  <!-- ===== Servos (left column) ===== -->
  <g transform="translate(40,560)">
    <text x="0" y="-14" class="lbl" font-weight="bold">Servos (channel &#8594; upstream servoPins index)</text>
    <g font-size="13">
      <!-- 8 servo connectors -->
      <g>
        <rect x="0" y="0" width="150" height="26" rx="5" fill="#f6a623"/><text x="8" y="18" fill="#111">ch0 &#8594; leg 1</text>
        <rect x="0" y="34" width="150" height="26" rx="5" fill="#f6a623"/><text x="8" y="52" fill="#111">ch1 &#8594; leg 2</text>
        <rect x="0" y="68" width="150" height="26" rx="5" fill="#f6a623"/><text x="8" y="86" fill="#111">ch2 &#8594; leg 4</text>
        <rect x="0" y="102" width="150" height="26" rx="5" fill="#f6a623"/><text x="8" y="120" fill="#111">ch3 &#8594; leg 6</text>
        <rect x="0" y="136" width="150" height="26" rx="5" fill="#f6a623"/><text x="8" y="154" fill="#111">ch4 &#8594; leg 8</text>
        <rect x="0" y="170" width="150" height="26" rx="5" fill="#f6a623"/><text x="8" y="188" fill="#111">ch5 &#8594; leg 10</text>
        <rect x="0" y="204" width="150" height="26" rx="5" fill="#f6a623"/><text x="8" y="222" fill="#111">ch6 &#8594; leg 13</text>
        <rect x="0" y="238" width="150" height="26" rx="5" fill="#f6a623"/><text x="8" y="256" fill="#111">ch7 &#8594; leg 14</text>
      </g>
    </g>
    <text x="0" y="290" class="note">Servo V+/GND come from the PCA9685's own 3-pin headers &#8212; not separate rail runs.</text>
  </g>

  <!-- ===== S3 Mini ===== -->
  <g transform="translate(900,560)">
    <rect x="0" y="0" width="250" height="360" rx="14" fill="#8e1f6b" class="board"/>
    <text x="125" y="28" text-anchor="middle" font-size="20" fill="#fff" font-weight="bold">Lolin S3 Mini</text>
    <text x="125" y="48" text-anchor="middle" font-size="12" fill="#f4c6e6">ESP32-S3 &#183; quad PSRAM</text>
    <rect x="95" y="320" width="60" height="34" rx="6" fill="#333"/>
    <text x="125" y="343" text-anchor="middle" font-size="11" fill="#ccc">USB-C</text>
    <!-- left pins (power/i2c) -->
    <g font-size="12">
      <rect x="-70" y="70" width="66" height="22" rx="4" fill="#e23b2e"/><text x="-37" y="85" text-anchor="middle" class="pin">5V</text>
      <rect x="-70" y="98" width="66" height="22" rx="4" fill="#f4b400"/><text x="-37" y="113" text-anchor="middle" class="pin" fill="#111">3V3</text>
      <rect x="-70" y="126" width="66" height="22" rx="4" fill="#141414"/><text x="-37" y="141" text-anchor="middle" class="pin">GND</text>
      <rect x="-70" y="154" width="66" height="22" rx="4" fill="#33aa44"/><text x="-37" y="169" text-anchor="middle" class="pin">35 SDA</text>
      <rect x="-70" y="182" width="66" height="22" rx="4" fill="#2aa4dd"/><text x="-37" y="197" text-anchor="middle" class="pin">36 SCL</text>
      <rect x="-70" y="210" width="66" height="22" rx="4" fill="#8e44ad"/><text x="-37" y="225" text-anchor="middle" class="pin">18 OE</text>
    </g>
    <!-- right pins (UWB SPI) -->
    <g font-size="12">
      <rect x="254" y="70" width="72" height="22" rx="4" fill="#7a5cff"/><text x="290" y="85" text-anchor="middle" class="pin">12 SCK</text>
      <rect x="254" y="98" width="72" height="22" rx="4" fill="#7a5cff"/><text x="290" y="113" text-anchor="middle" class="pin">11 MOSI</text>
      <rect x="254" y="126" width="72" height="22" rx="4" fill="#7a5cff"/><text x="290" y="141" text-anchor="middle" class="pin">13 MISO</text>
      <rect x="254" y="154" width="72" height="22" rx="4" fill="#7a5cff"/><text x="290" y="169" text-anchor="middle" class="pin">10 CSn</text>
      <rect x="254" y="182" width="72" height="22" rx="4" fill="#7a5cff"/><text x="290" y="197" text-anchor="middle" class="pin">14 IRQ</text>
      <rect x="254" y="210" width="72" height="22" rx="4" fill="#7a5cff"/><text x="290" y="225" text-anchor="middle" class="pin">21 RSTn</text>
      <rect x="254" y="238" width="72" height="22" rx="4" fill="#7a5cff"/><text x="290" y="253" text-anchor="middle" class="pin">16 WAKE</text>
      <rect x="254" y="266" width="72" height="22" rx="4" fill="#7a5cff"/><text x="290" y="281" text-anchor="middle" class="pin">17 EXTON</text>
    </g>
  </g>

  <!-- ===== OLED ===== -->
  <g transform="translate(1300,300)">
    <rect x="0" y="0" width="300" height="180" rx="12" fill="#1b6fb0" class="board"/>
    <rect x="24" y="44" width="252" height="110" rx="8" fill="#0a0a0a"/>
    <text x="150" y="118" text-anchor="middle" font-size="44" fill="#eaeaea">(&#183;&#183;&#183;&#711;&#969;&#711;&#183;&#183;&#183;)</text>
    <text x="150" y="24" text-anchor="middle" font-size="15" fill="#fff">SSD1306 OLED (I2C 0x3C)</text>
    <g font-size="12" fill="#fff">
      <text x="40" y="172">GND</text><text x="95" y="172">VCC</text><text x="150" y="172">SCL</text><text x="205" y="172">SDA</text>
    </g>
  </g>

  <!-- ===== UWB header + DWM module (WITH) ===== -->
  <g transform="translate(1300,560)">
    <rect x="0" y="0" width="380" height="300" rx="12" fill="#f3f0ff" class="board"/>
    <text x="16" y="28" class="lbl" font-weight="bold">UWB 8-pin SPI header &#8212; POPULATED</text>
    <!-- DWM module -->
    <rect x="200" y="46" width="160" height="150" rx="8" fill="#2b2b2b"/>
    <text x="280" y="74" text-anchor="middle" font-size="15" fill="#fff">DWM3000 /</text>
    <text x="280" y="94" text-anchor="middle" font-size="15" fill="#fff">DWM1000</text>
    <rect x="228" y="110" width="104" height="60" rx="4" fill="#c9a24a"/>
    <text x="280" y="146" text-anchor="middle" font-size="12" fill="#111">UWB antenna</text>
    <!-- header pins -->
    <g font-size="12" fill="#fff">
      <rect x="16" y="52" width="150" height="20" rx="3" fill="#7a5cff"/><text x="24" y="67">SCK &#8592; GPIO12</text>
      <rect x="16" y="76" width="150" height="20" rx="3" fill="#7a5cff"/><text x="24" y="91">MOSI &#8592; GPIO11</text>
      <rect x="16" y="100" width="150" height="20" rx="3" fill="#7a5cff"/><text x="24" y="115">MISO &#8594; GPIO13</text>
      <rect x="16" y="124" width="150" height="20" rx="3" fill="#7a5cff"/><text x="24" y="139">CSn &#8592; GPIO10</text>
      <rect x="16" y="148" width="150" height="20" rx="3" fill="#7a5cff"/><text x="24" y="163">IRQ &#8594; GPIO14</text>
      <rect x="16" y="172" width="150" height="20" rx="3" fill="#b00020"/><text x="24" y="187">RSTn &#8212; GPIO21</text>
      <rect x="16" y="196" width="150" height="20" rx="3" fill="#7a5cff"/><text x="24" y="211">WAKE &#8592; GPIO16</text>
      <rect x="16" y="220" width="150" height="20" rx="3" fill="#7a5cff"/><text x="24" y="235">EXTON &#8594; GPIO17</text>
    </g>
    <text x="16" y="262" class="warn">RSTn is open-drain &#8212; never drive it high.</text>
    <text x="16" y="284" class="note">WAKEUP/EXTON used by DWM3000; leave NC for DWM1000.</text>
  </g>

  <!-- ============ WIRES ============ -->
  <!-- battery + -> switch -> buck IN+ -->
  <path class="wire w5v" d="M296,175 L360,143"/>
  <path class="wire w5v" d="M430,143 L454,143 L454,178 L470,178"/>
  <!-- battery - -> GND star -->
  <path class="wire gnd" d="M296,255 L330,255 L330,432 L484,432"/>
  <!-- USB-C 5V -> SPDT -->
  <path class="wire w5v" d="M290,320 L360,320"/>
  <!-- SPDT common -> 5V rail -->
  <path class="wire w5v" d="M450,335 L460,335 L460,478 L484,478"/>
  <!-- buck OUT+ -> 5V rail -->
  <path class="wire w5v" d="M690,178 L720,178 L720,360 L448,360 L448,478 L484,478"/>
  <!-- buck OUT- -> GND star -->
  <path class="wire gnd" d="M690,254 L708,254 L708,432 L830,432"/>
  <!-- 5V rail -> PCA9685 V+ -->
  <path class="wire w5v" d="M482,646 L470,646"/>
  <path class="wire w5v" d="M500,520 L500,646"/>
  <!-- 5V rail -> S3 5V (separate branch, NOT chained off V+) -->
  <path class="wire w5v" d="M820,478 L860,478 L860,641 L830,641"/>
  <!-- cap across V+/GND -->
  <path class="wire w5v" d="M881,470 L881,452 L520,452 L520,520"/>
  <path class="wire gnd" d="M881,526 L881,548 L560,548 L560,520"/>
  <!-- PCA9685 GND -> star -->
  <path class="wire gnd" d="M482,672 L440,672 L440,470 L440,470"/>
  <path class="wire gnd" d="M440,672 L440,470"/>
  <!-- S3 3V3 -> PCA9685 VCC + OLED VCC + UWB 3V3 -->
  <path class="wire v33" d="M830,669 L878,669 L878,709 L562,709 L562,600"/>
  <!-- S3 GND -> star -->
  <path class="wire gnd" d="M830,695 L900,695" />
  <path class="wire gnd" d="M830,695 L845,695 L845,470 L440,470"/>
  <!-- I2C SDA: S3 GPIO2 -> PCA9685 SDA + OLED SDA -->
  <path class="wire sda" d="M830,725 L517,725 L517,724"/>
  <path class="wire sda" d="M830,725 L1300,725 L1300,600"/>
  <path class="wire sda" d="M517,724 L517,724"/>
  <!-- I2C SCL: S3 GPIO3 -> PCA9685 SCL + OLED SCL -->
  <path class="wire scl" d="M830,753 L595,753 L595,746"/>
  <path class="wire scl" d="M830,753 L1280,753 L1280,600"/>
  <!-- OE: S3 18 -> PCA9685 OE -->
  <path class="wire oe" d="M830,781 L673,781 L673,746"/>
  <!-- OLED VCC/GND/SCL/SDA short taps to top -->
  <path class="wire gnd" d="M1340,480 L1340,470 L845,470"/>
  <path class="wire w5v" d="M1395,480 L1395,360 L820,360"/>
  <!-- UWB SPI ribbon: S3 right pins -> header -->
  <path class="wire spi" d="M1226,630 L1260,630 L1260,620 L1300,620"/>
  <path class="wire spi" d="M1226,658 L1250,658 L1250,644 L1300,644"/>
  <path class="wire spi" d="M1226,686 L1244,686 L1244,668 L1300,668"/>
  <path class="wire spi" d="M1226,714 L1240,714 L1240,692 L1300,692"/>
  <path class="wire spi" d="M1226,742 L1236,742 L1236,716 L1300,716"/>
  <path class="wire spi" d="M1226,770 L1232,770 L1232,740 L1300,740"/>
  <path class="wire spi" d="M1226,630 L1226,630"/>
  <!-- UWB 3V3 -->
  <path class="wire v33" d="M1300,760 L1290,760 L1290,600"/>

  <!-- ============ Callout notes ============ -->
  <g>
    <text x="900" y="960" class="warn">Critical: PCA9685 VCC (3V3) is logic only &#8212; it is NOT V+ (5V).</text>
    <text x="900" y="984" class="warn">Critical: the S3 5V branch is drawn from the rail node, NOT chained off the PCA9685 V+ terminal.</text>
    <text x="900" y="1008" class="warn">Critical: servo current never flows through the ESP32.</text>
    <text x="900" y="1032" class="note">Set the LM2596S to 5.2V with no load before connecting anything. Confirm 0x3C &#38; 0x40 enumerate before attaching servos.</text>
  </g>

  <!-- perfboard hint photos placeholders -->
  <g transform="translate(40,900)">
    <rect x="0" y="0" width="360" height="150" rx="10" fill="#f4f4f4" class="board"/>
    <text x="180" y="70" text-anchor="middle" font-size="14" fill="#777">Assembly reference: build the 5V rail + ground</text>
    <text x="180" y="92" text-anchor="middle" font-size="14" fill="#777">star on perfboard; keep 30AWG data, 22AWG power.</text>
  </g>
</svg>
